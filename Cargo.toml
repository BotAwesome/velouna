[package]
name = "velouna"
version = "0.4.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/BotAwesome/velouna"

[lib]
name = "velouna"
path = "src/lib.rs"

[[bin]]
name = "velouna"
path = "src/main.rs"

[workspace]
members = [".", "i18n-macros", "setup", "android/velouna-android"]
# The Android library is built with cargo-ndk (android/build.ps1), not on the host.
default-members = [".", "i18n-macros", "setup"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "7.0.0"
flate2 = "1"
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow"] }
egui-phosphor = { version = "0.10", features = ["regular", "fill"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "ico", "gif"] }
libloading = "0.8"
log = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
# Lua plugins: velouna.hash (HMAC signatures for web APIs).
sha1 = "0.10"
hmac = "0.12"
# Plugin repos: repo.json is signed with Ed25519 (design/plugins.md §8).
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
base64 = "0.22"
getrandom = "0.2"
sys-locale = "0.3"
velouna-i18n-macros = { path = "i18n-macros" }
ureq = { version = "2", features = ["json"] }
# Plugins: Lua 5.4, built from source (same on Windows, Linux and Android).
rustfft = "6"
# Plugin packages (.velounaplugin) are zip files.
zip = { version = "2", default-features = false, features = ["deflate"] }
mlua = { version = "0.10", features = ["lua54", "vendored", "send"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = "3"
eframe = { version = "0.32", default-features = false, features = ["accesskit"] }
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
rfd = "0.15"
# Media keys and the Windows media overlay (SMTC), taskbar buttons and jump
# list, thumbnails and tags from the shell. Already in the tree via other
# crates, so no new download.
windows = { version = "0.61", features = [
    "Foundation",
    "Media",
    "Storage",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_EnhancedStorage",
] }

# Linux desktop: Wayland and X11 windows, Wayland clipboard, the Secret
# Service (GNOME Keyring / KWallet) for the Plex sign-in, file dialogs via
# the desktop portal. All pure Rust over D-Bus, so the build needs no GTK
# or libdbus headers and the binary only loads what the desktop has.
[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3", features = ["wayland-data-control"] }
eframe = { version = "0.32", default-features = false, features = ["wayland", "x11"] }
keyring = { version = "3", features = ["async-secret-service", "async-io", "crypto-rust"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
# Keeping the screen awake during playback (portal Inhibit, ScreenSaver).
zbus = "5"
# Only to pick X11 over Wayland on request (VELOUNA_X11=1); same as eframe's.
winit = { version = "0.30", default-features = false, features = ["x11"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
eframe = { version = "0.32", default-features = false, features = ["android-native-activity"] }
jni = "0.21"
velouna-rfd-shim = { path = "android/shims/rfd" }
winit = "0.30"

[build-dependencies]
winresource = "0.1"
