[package]
name = "velour-setup"
version = "0.1.2"
edition = "2024"
description = "Installer for Velour"

[[bin]]
name = "velour-setup"
path = "src/main.rs"

# Build tool: appends the compressed program files to the setup stub.
[[bin]]
name = "velour-pack"
path = "src/pack.rs"

[dependencies]
dirs = "7.0.0"
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
egui-phosphor = { version = "0.10", features = ["regular", "fill"] }
keyring = { version = "3", features = ["windows-native"] }
mslnk = "0.1"
rfd = "0.15"
sys-locale = "0.3"
winreg = "0.55"
zstd = { version = "0.13", features = ["zstdmt"] }

[build-dependencies]
winresource = "0.1"
